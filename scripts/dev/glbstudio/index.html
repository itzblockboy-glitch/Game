<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#20242b;overflow:hidden}canvas{display:block}
</style></head>
<body>
<script type="module">
import * as THREE from '/vendor/three.module.js';
import { GLTFLoader } from '/vendor/GLTFLoader.js';

const H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, H);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.72;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x23262c);
const camera = new THREE.PerspectiveCamera(35, innerWidth / H, 0.1, 200);

// studio env: bright softbox gradient via PMREM from a generated equirect
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
const skyGeo = new THREE.SphereGeometry(50, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {},
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `varying vec3 vP; void main(){
    vec3 d = normalize(vP);
    float up = clamp(d.y*0.5+0.5, 0.0, 1.0);
    vec3 c = mix(vec3(0.35,0.38,0.42), vec3(1.2,1.24,1.3), pow(up, 1.4));
    // three softbox strips
    float s1 = smoothstep(0.55, 0.95, dot(d, normalize(vec3(0.6,0.6,0.4))));
    float s2 = smoothstep(0.6, 0.98, dot(d, normalize(vec3(-0.7,0.3,0.2))));
    float s3 = smoothstep(0.75, 0.99, dot(d, normalize(vec3(0.0,0.4,-0.9))));
    c += vec3(s1)*1.8 + vec3(s2)*1.1 + vec3(s3)*0.7;
    gl_FragColor = vec4(c, 1.0);
  }`,
});
envScene.add(new THREE.Mesh(skyGeo, skyMat));
scene.environment = pmrem.fromScene(envScene, 0.02).texture;
scene.environmentIntensity = 0.30;

scene.add(new THREE.HemisphereLight(0xcfe2ff, 0x2a2a2e, 0.28));
const key = new THREE.DirectionalLight(0xfff4e2, 1.5);
key.position.set(6, 9, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -9; key.shadow.camera.right = 9;
key.shadow.camera.top = 9; key.shadow.camera.bottom = -9;
key.shadow.bias = -0.0006;
scene.add(key);
const fill = new THREE.DirectionalLight(0x9fc4ff, 0.3);
fill.position.set(-7, 4, -6);
scene.add(fill);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(40, 64),
  new THREE.MeshStandardMaterial({ color: 0x30343b, roughness: 0.35, metalness: 0.15 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

window.__shots = [];
window.__ready = false;
const loader = new GLTFLoader();
const url = new URLSearchParams(location.search).get('m') || '/models/ferrari_daytona_sp3.glb';
loader.load(url, (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  root.position.y -= box.min.y;
  scene.add(root);
  window.__info = { size: size.toArray().map(n => +n.toFixed(2)), center: center.toArray().map(n => +n.toFixed(2)) };
  const R = Math.max(size.x, size.y, size.z);
  window.__aim = (az, el, dist = R * 1.5, ty = size.y * 0.45) => {
    const x = Math.sin(az) * Math.cos(el) * dist;
    const z = Math.cos(az) * Math.cos(el) * dist;
    const y = Math.sin(el) * dist;
    camera.position.set(center.x + x, y + ty, center.z + z);
    camera.lookAt(center.x, ty, center.z);
    camera.updateProjectionMatrix();
  };
  window.__ready = true;
}, undefined, (e) => { window.__err = String(e); });
function frame() { requestAnimationFrame(frame); renderer.render(scene, camera); }
frame();
</script></body></html>
